version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: v2
    schedule:
      interval: weekly
    groups:
      build-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: v2
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /
    target-branch: v2
    schedule:
      interval: monthly
