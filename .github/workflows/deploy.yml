name: Deploy to GitHub Pages

on:
  push:
    branches: [v2]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Pages
        uses: actions/configure-pages@v5
      
      - name: Build _site
        run: |
          mkdir -p _site
          cp -R assets documents _site/
          cp index.html CNAME .nojekyll robots.txt favicon.ico _site/

          if [ -f llms.txt ]; then cp llms.txt _site/; fi
          if [ -f sitemap.xml ]; then cp sitemap.xml _site/; fi

          for dir in i18n/*/ ; do
            lang="$(basename "$dir")"
            cp -R "$dir" "_site/$lang"
          done

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
