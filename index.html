  <script>
    window.SUPPORTED_LANGS = {{{BUILD_SUPPORTED_LANGS_JSON}}};
    (function () {
      try {
        var supported = window.SUPPORTED_LANGS;
        var url = new URL(window.location.href);
        var queryLang = url.searchParams.get('lang');
        var storedLang = null;
        var lang = null;

        try {
          storedLang = localStorage.getItem('lang');
        } catch (_) {}

        function pickLang(langs) {
          for (var i = 0; i < langs.length; i++) {
            var value = (langs[i] || '').toLowerCase();
            var prefix = value.slice(0, 2);
            if (supported.indexOf(value) >= 0) return value;
            if (supported.indexOf(prefix) >= 0) return prefix;
          }
          return null;
        }

        lang = (queryLang && supported.indexOf(queryLang) >= 0)
          ? queryLang
          : (storedLang && supported.indexOf(storedLang) >= 0)
            ? storedLang
          : pickLang(navigator.languages || [navigator.language]) || supported[0];

        if (queryLang && supported.indexOf(queryLang) >= 0) {
          try {
            localStorage.setItem('lang', queryLang);
          } catch (_) {}
        }

        var path = window.location.pathname.replace(/\/index\.html\/?$/, '/');
        if (!path.endsWith('/')) path += '/';

{{{BUILD_REDIRECT_LOCALE_TEST_LINE}}}
      } catch (e) {
        // Fall back to the manual picker in <noscript>.
      }
    })();
  </script>
